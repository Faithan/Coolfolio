<script>
// Run immediately after this component is injected so elements exist
(function () {
    const toggler = document.getElementById('navbarTogglerBtn');
    const icon = document.getElementById('navbarTogglerIcon');
    const navbar = document.getElementById('mainNavbar');

    if (!toggler || !icon || !navbar) return;

    navbar.addEventListener('show.bs.collapse', function () {
        icon.classList.remove('fa-bars');
        icon.classList.add('fa-xmark');
    });
    navbar.addEventListener('hide.bs.collapse', function () {

    });
})();

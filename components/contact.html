<section class="contact" id="contact" style="padding-top: 80px;">
    <h1 class="hidden-animation">Contact</h1>
    <p class="text-primary hidden-animation">Feel free to reach out by submitting the form below, and I will respond as quickly as possible.</p>
    <div class="contact-container hidden-animation">
        <form id="contactForm" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="a54c7ac8-4e1f-4883-aa63-b87e866d75a8">

            <label for="">Name</label>
            <input type="text" name="name" required placeholder="Your Name">
            <label for="">Email</label>
            <input type="email" name="email" required placeholder="Your Work Email">
            <label for="">Message</label>
            <textarea name="message" required placeholder="Your Message"></textarea>

            <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

            <p id="contactSuccessMsg"></p>
            <button type="submit">Submit</button>
        </form>
    </div>

    <div id="loadingScreen" style="display: none;">
        <div class="spinner"></div>
    </div>

    <style>
        #loadingScreen { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:9999; }
        .spinner { border: 8px solid #f3f3f3; border-top:8px solid var(--color10); border-radius:50%; width:50px; height:50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    </style>

    <script>
    (function () {
        const form = document.getElementById('contactForm');
        if (!form) return;

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            document.getElementById('loadingScreen').style.display = 'flex';

            fetch('https://api.web3forms.com/submit', { method: 'POST', body: new FormData(this) })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loadingScreen').style.display = 'none';
                    if (data.success) {
                        document.getElementById('contactSuccessMsg').innerHTML = '<div class="alert alert-success mt-3 d-flex align-items-center" role="alert"><i class="fa-solid fa-circle-check me-2"></i>Thank you! Your message has been sent successfully.</div>';
                        form.reset();
                    } else {
                        document.getElementById('contactSuccessMsg').innerHTML = '<div class="alert alert-danger mt-3 d-flex align-items-center" role="alert"><i class="fa-solid fa-circle-xmark me-2"></i>Something went wrong. Please try again later.</div>';
                    }
                })
                .catch(error => {
                    document.getElementById('loadingScreen').style.display = 'none';
                    console.error('Error:', error);
                    document.getElementById('contactSuccessMsg').innerHTML = '<div class="alert alert-danger mt-3 d-flex align-items-center" role="alert"><i class="fa-solid fa-triangle-exclamation me-2"></i>There was an issue submitting your form. Please try again later.</div>';
                });
        });
    })();
    </script>

</section>
